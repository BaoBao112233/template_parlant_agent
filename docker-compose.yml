version: '3.8'

services:
  parlant-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: parlant-lifestyle-agent
    ports:
      - "8000:8000"   # FastAPI with Web UI
    volumes:
      - ./service-account.json:/app/service-account.json:ro
      - ./logs:/app/logs
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - PARLANT_HOST=0.0.0.0
      - PARLANT_PORT=8800
      - VERTEX_AI_PROJECT_ID=${VERTEX_AI_PROJECT_ID:-}
      - VERTEX_AI_LOCATION=${VERTEX_AI_LOCATION:-us-central1}
      - VERTEX_AI_REGION=${VERTEX_AI_LOCATION:-us-central1}
      - VERTEX_AI_MODEL=${VERTEX_AI_MODEL:-gemini-2.0-flash-exp}
      - AGENT_NAME=${AGENT_NAME:-LifestyleAssistant}
      - WEATHER_API_KEY=${WEATHER_API_KEY:-}
      - NEWS_API_KEY=${NEWS_API_KEY:-}
      - EXCHANGE_RATE_API_KEY=${EXCHANGE_RATE_API_KEY:-}
    restart: unless-stopped
    networks:
      - parlant-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  parlant-network:
    driver: bridge

volumes:
  logs:
